# Pure pursuit on the crossing geometry — the failure Phase 3 exists to beat.
#
# The missile steers straight at where the target is and ends up in a tail
# chase. Against a target flying straight it does eventually arrive — after
# 18.8 s, at 72 m/s of closing speed, its energy spent turning — where
# proportional navigation is done at 13.5 s and 284 m/s. Add a manoeuvre to the
# target and pursuit stops arriving at all.

name = "pursuit-crossing"
description = "Pure pursuit against a crossing target — the deliberate baseline"
duration = 30.0

[missile]
position = [0.0, 0.0, 1000.0]
speed = 60.0

[target]
position = [0.0, 6000.0, 1000.0]
velocity = [250.0, 0.0, 0.0]

[guidance]
law = "pursuit"

[seeker]
enabled = false
